
server {
    listen 80;
    server_name lobato;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte ao React Router (SPA) - redireciona rotas desconhecidas para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dos arquivos estáticos
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy Reverso para a API Node.js
    location /api/ {
        # 'back' é o nome exato do serviço Node.js definido no seu docker-compose
        proxy_pass http://rotadorole_back:13021/; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
