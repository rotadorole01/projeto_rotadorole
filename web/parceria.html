
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seja um Parceiro - Rota do Rolê</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        #btn-traducao {
            position: fixed !important;
            right: 10px !important;
            bottom: 405px !important;
            left: auto !important;
            top: auto !important;
            z-index: 9999999 !important;
            width: 44px !important;
            height: 44px !important;
            border: none !important;
            border-radius: 8px !important;
            background-color: #1565c0 !important;
            color: #ffffff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1.4rem !important;
            cursor: pointer !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2) !important;
            transition: background-color 0.3s ease,
                        transform 0.2s ease !important;
        }

        #btn-traducao:hover {
            background-color: #0d47a1 !important;
            transform: scale(1.05) !important;
        }

        #themeToggle {
            position: fixed !important;
            right: 10px !important;
            bottom: 355px !important;
            left: auto !important;
            top: auto !important;
            z-index: 9999999 !important;
            width: 44px !important;
            height: 44px !important;
            border: none !important;
            border-radius: 8px !important;
            background-color: #1565c0 !important;
            color: white !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1.2rem !important;
            cursor: pointer !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2) !important;
            transition: background-color 0.3s ease,
                        transform 0.2s ease !important;
        }

        #themeToggle:hover {
            background-color: #0d47a1 !important;
            transform: scale(1.05) !important;
        }

        @media (max-width: 768px) {
            #btn-traducao {
                bottom: 80px !important;
                right: 10px !important;
            }

            #themeToggle {
                bottom: 20px !important;
                right: 10px !important;
            }
        }

        #avisoPatrocinio {
            display: none;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            line-height: 1.6;
            text-align: center;
        }

        #avisoPatrocinio.sucesso {
            display: block;
            background-color: #e8f5e9;
            color: #256029;
            border: 1px solid #a5d6a7;
        }

        #avisoPatrocinio.erro {
            display: block;
            background-color: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
        }

        #avisoPatrocinio.informacao {
            display: block;
            background-color: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #90caf9;
        }

        #partnerForm[hidden] {
            display: none !important;
        }

        #partnerForm button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .erro-campo {
            color: #c62828;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .campo-invalido {
            border: 2px solid #e53935 !important;
        }
    </style>

    <script src="js/apiConfig.js"></script>
</head>

<body>
    <div id="google_translate_element"
         style="display:none;"></div>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-container">

            <a href="index.html" class="logo">
                <i class="fas fa-map-marker-alt"></i>
                Rota do Rolê
            </a>

            <nav style="display:flex; align-items:center; gap:2rem;">

                <ul style="list-style:none; display:flex; gap:2rem; margin:0; align-items:center;">

                    <li>
                        <a href="index.html">Início</a>
                    </li>

                    <li>
                        <a href="eventos.html">Eventos</a>
                    </li>

                    <li>
                        <a href="nos.html">Sobre Nós</a>
                    </li>

                    <li>
                        <a href="cadastro.html"
                           class="link-cadastrar-evento">
                            Cadastrar Evento
                        </a>
                    </li>
                </ul>

                <a href="entrar.html"
                   id="linkEntrarCabecalho"
                   class="profile-menu-btn"
                   style="display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.12); color:white; text-decoration:none;"
                   aria-label="Entrar na conta">

                    <i class="fas fa-sign-in-alt"
                       style="color:#f7b801 !important;"></i>

                    <span>Entrar</span>
                </a>

                <div class="user-profile-menu"
                     style="display:none;">

                    <button onclick="toggleProfileMenu()"
                            class="profile-menu-btn"
                            id="profileMenuBtn"
                            type="button">

                        <i class="fas fa-user-circle"
                           style="color:#f7b801;"></i>

                        <span>Minha Conta</span>

                        <i class="fas fa-caret-down"></i>
                    </button>

                    <div id="profileDropdown"
                         class="profile-dropdown">

                        <a href="perfil.html">
                            <i class="fas fa-id-card"></i>
                            Meu Perfil
                        </a>

                        <hr>

                        <a href="login.html">
                            <i class="fas fa-user-plus"></i>
                            Criar Conta
                        </a>

                        <a href="entrar.html"
                           onclick="sessionStorage.removeItem('rota_token')">
                            <i class="fas fa-sign-in-alt"></i>
                            Trocar Conta
                        </a>

                        <hr>

                        <a href="index.html"
                           class="logout-btn">
                            <i class="fas fa-sign-out-alt"></i>
                            Sair
                        </a>
                    </div>
                </div>

                <button id="themeToggle"
                        title="Alternar Modo Escuro"
                        type="button">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- PARCERIA -->
    <section id="parceria" style="margin-top:0;">

        <div style="background:linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%); padding:4rem 20px; text-align:center; color:white;">

            <h1 style="font-size:2.5rem; margin-bottom:1rem;">
                Conecte sua marca à Rota do Rolê!
            </h1>

            <p style="font-size:1.2rem; max-width:800px; margin:0 auto;">
                Destaque o seu negócio para milhares de pessoas
                que buscam diversão, cultura e gastronomia na cidade.
            </p>
        </div>

        <div class="container"
             style="margin-top:-3rem; position:relative; z-index:10;">

            <div style="max-width:700px; margin:0 auto; background:var(--card-bg); padding:2.5rem; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.15);">

                <h2 style="color:var(--secondary-color); margin-bottom:2rem; font-size:1.8rem; text-align:center;">
                    Solicitar Contato Comercial
                </h2>

                <div id="avisoPatrocinio"
                     role="status"
                     aria-live="polite"></div>

                <form id="partnerForm" hidden>

                    <!-- EMPRESA -->
                    <div class="form-group">

                        <label for="empresaNome">
                            Nome da Empresa / Negócio *
                        </label>

                        <input type="text"
                               id="empresaNome"
                               name="empresaNome"
                               placeholder="Ex: Cervejaria Artesanal TQ"
                               maxlength="150"
                               required>
                    </div>

                    <div class="form-row">

                        <!-- CNPJ -->
                        <div class="form-group">

                            <label for="cnpj">CNPJ</label>

                            <input type="text"
                                   id="cnpj"
                                   name="cnpj"
                                   placeholder="00.000.000/0000-00"
                                   maxlength="18"
                                   inputmode="numeric"
                                   autocomplete="off">

                            <small id="erroCNPJ"
                                   class="erro-campo"></small>
                        </div>

                        <!-- ÁREA -->
                        <div class="form-group">

                            <label for="areaAtuacao">
                                Área de Atuação *
                            </label>

                            <select id="areaAtuacao"
                                    name="areaAtuacao"
                                    required>

                                <option value="">
                                    Selecione...
                                </option>

                                <option value="gastronomia">
                                    Gastronomia / Restaurante
                                </option>

                                <option value="bar">
                                    Bar / Balada
                                </option>

                                <option value="entretenimento">
                                    Entretenimento / Casa de Shows
                                </option>

                                <option value="servicos">
                                    Serviços Gerais
                                </option>

                                <option value="outro">
                                    Outro
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">

                        <!-- RESPONSÁVEL -->
                        <div class="form-group">

                            <label for="responsavel">
                                Nome do Responsável *
                            </label>

                            <input type="text"
                                   id="responsavel"
                                   name="responsavel"
                                   placeholder="Seu nome"
                                   required>
                        </div>

                        <!-- TELEFONE -->
                        <div class="form-group">

                            <label for="telefoneComercial">
                                Telefone / WhatsApp *
                            </label>

                            <input type="tel"
                                   id="telefoneComercial"
                                   name="telefoneComercial"
                                   placeholder="(16) 99999-9999"
                                   maxlength="15"
                                   inputmode="numeric"
                                   required>

                            <small id="erroTelefone"
                                   class="erro-campo"></small>
                        </div>
                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="emailComercial">
                            Email Corporativo *
                        </label>

                        <input type="email"
                               id="emailComercial"
                               name="emailComercial"
                               placeholder="contato@suaempresa.com.br"
                               required>
                    </div>

                    <!-- INTERESSE -->
                    <div class="form-group">

                        <label for="tipoParceria">
                            Qual é o seu interesse principal? *
                        </label>

                        <select id="tipoParceria"
                                name="tipoParceria"
                                required>

                            <option value="">
                                Selecione...
                            </option>

                            <option value="patrocinio_site">
                                Banner e Patrocínio no Site
                            </option>

                            <option value="destaque_eventos">
                                Destacar meus Eventos
                            </option>

                            <option value="parceria_divulgacao">
                                Parceria de Divulgação Mútua
                            </option>
                        </select>
                    </div>

                    <!-- MENSAGEM -->
                    <div class="form-group">

                        <label for="mensagem">
                            Mensagem Adicional (Opcional)
                        </label>

                        <textarea id="mensagem"
                                  name="mensagem"
                                  placeholder="Conte um pouco sobre sua empresa e o que espera da parceria..."></textarea>
                    </div>

                    <!-- BOTÃO -->
                    <button type="submit"
                            id="btnEnviarPatrocinio"
                            class="btn"
                            style="width:100%; font-size:1.1rem; padding:1rem;">

                        <i class="fas fa-paper-plane"></i>
                        Enviar Solicitação
                    </button>

                </form>
            </div>
        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script>

        const partnerForm =
            document.getElementById("partnerForm");

        const avisoPatrocinio =
            document.getElementById("avisoPatrocinio");

        const btnEnviarPatrocinio =
            document.getElementById("btnEnviarPatrocinio");

        const campoCNPJ =
            document.getElementById("cnpj");

        const campoTelefone =
            document.getElementById("telefoneComercial");

        const erroCNPJ =
            document.getElementById("erroCNPJ");

        const erroTelefone =
            document.getElementById("erroTelefone");

        const API_PARCEIROS =
            `${API_CONFIG.BASE_URL}/parceiros`;

        const mensagemSucesso =
            "Cadastro recebido com sucesso! Nossa equipe recebeu " +
            "sua solicitação de patrocínio e entrará em contato " +
            "para informar sobre a aprovação e, caso aprovado, " +
            "definir os detalhes da parceria. Aguarde nosso retorno!";

        const mensagemDuplicada =
            "Você já possui uma solicitação de patrocínio " +
            "cadastrada. Aguarde o retorno da nossa equipe.";

        // SOMENTE NÚMEROS
        function somenteNumeros(valor) {
            return valor.replace(/\D/g, "");
        }

        // MÁSCARA AUTOMÁTICA DE CNPJ
        function aplicarMascaraCNPJ(valor) {
            const numeros =
                somenteNumeros(valor).slice(0, 14);

            return numeros
                .replace(/^(\d{2})(\d)/, "$1.$2")
                .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
                .replace(/\.(\d{3})(\d)/, ".$1/$2")
                .replace(/(\d{4})(\d)/, "$1-$2");
        }

        // MÁSCARA AUTOMÁTICA DE TELEFONE
        function aplicarMascaraTelefone(valor) {
            const numeros =
                somenteNumeros(valor).slice(0, 11);

            if (numeros.length <= 10) {
                return numeros
                    .replace(/^(\d{2})(\d)/, "($1) $2")
                    .replace(/(\d{4})(\d)/, "$1-$2");
            }

            return numeros
                .replace(/^(\d{2})(\d)/, "($1) $2")
                .replace(/(\d{5})(\d)/, "$1-$2");
        }

        // MOSTRAR ERRO DE CAMPO
        function mostrarErroCampo(campo, elementoErro, mensagem) {
            campo.classList.add("campo-invalido");
            elementoErro.textContent = mensagem;
            elementoErro.style.display = "block";
        }

        // LIMPAR ERRO DE CAMPO
        function limparErroCampo(campo, elementoErro) {
            campo.classList.remove("campo-invalido");
            elementoErro.textContent = "";
            elementoErro.style.display = "none";
        }

        // VALIDAR CNPJ
        function validarCNPJ() {
            const numeros =
                somenteNumeros(campoCNPJ.value);

            limparErroCampo(campoCNPJ, erroCNPJ);

            // CNPJ É OPCIONAL
            if (numeros.length === 0) {
                return true;
            }

            if (numeros.length !== 14) {
                mostrarErroCampo(
                    campoCNPJ,
                    erroCNPJ,
                    "O CNPJ deve conter exatamente 14 dígitos."
                );

                return false;
            }

            return true;
        }

        // VALIDAR TELEFONE
        function validarTelefone() {
            const numeros =
                somenteNumeros(campoTelefone.value);

            limparErroCampo(
                campoTelefone,
                erroTelefone
            );

            if (
                numeros.length !== 10 &&
                numeros.length !== 11
            ) {
                mostrarErroCampo(
                    campoTelefone,
                    erroTelefone,
                    "Informe um telefone com DDD e 10 ou 11 dígitos."
                );

                return false;
            }

            return true;
        }

        // APLICAR MÁSCARAS AO DIGITAR
        campoCNPJ.addEventListener("input", function () {
            this.value =
                aplicarMascaraCNPJ(this.value);

            limparErroCampo(
                campoCNPJ,
                erroCNPJ
            );
        });

        campoTelefone.addEventListener("input", function () {
            this.value =
                aplicarMascaraTelefone(this.value);

            limparErroCampo(
                campoTelefone,
                erroTelefone
            );
        });

        // VALIDAR AO SAIR DO CAMPO
        campoCNPJ.addEventListener(
            "blur",
            validarCNPJ
        );

        campoTelefone.addEventListener(
            "blur",
            validarTelefone
        );

        // MENSAGEM GERAL
        function mostrarAviso(mensagem, tipo) {
            avisoPatrocinio.textContent = mensagem;
            avisoPatrocinio.className = tipo;
        }

        function bloquearFormulario() {
            partnerForm.hidden = true;
        }

        function liberarFormulario() {
            partnerForm.hidden = false;
        }

        function obterToken() {
            return sessionStorage.getItem("rota_token");
        }

        function redirecionarParaLogin() {
            window.location.replace("entrar.html");
        }

        // VERIFICAR SE JÁ EXISTE SOLICITAÇÃO
        async function verificarSolicitacao() {
            const token = obterToken();

            bloquearFormulario();

            if (!token) {
                redirecionarParaLogin();
                return;
            }

            mostrarAviso(
                "Verificando sua solicitação de patrocínio...",
                "informacao"
            );

            try {
                const response = await fetch(
                    `${API_PARCEIROS}/minha-solicitacao`,
                    {
                        method: "GET",
                        headers: {
                            Authorization: `Bearer ${token}`
                        },
                        cache: "no-store"
                    }
                );

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {
                    sessionStorage.removeItem(
                        "rota_token"
                    );

                    redirecionarParaLogin();
                    return;
                }

                const resultado =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        resultado.message ||
                        "Não foi possível consultar sua solicitação."
                    );
                }

                if (resultado.exists) {
                    mostrarAviso(
                        mensagemDuplicada,
                        "informacao"
                    );

                    bloquearFormulario();
                    return;
                }

                avisoPatrocinio.className = "";
                avisoPatrocinio.textContent = "";

                liberarFormulario();

            } catch (erro) {
                console.error(
                    "Erro ao verificar patrocínio:",
                    erro
                );

                mostrarAviso(
                    "Não foi possível verificar sua solicitação. " +
                    "Confira se o servidor está ligado e " +
                    "atualize a página.",
                    "erro"
                );

                bloquearFormulario();
            }
        }

        // ENVIAR SOLICITAÇÃO
        partnerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const token = obterToken();

                if (!token) {
                    redirecionarParaLogin();
                    return;
                }

                if (btnEnviarPatrocinio.disabled) {
                    return;
                }

                // VALIDAR ANTES DE ENVIAR
                const cnpjValido = validarCNPJ();
                const telefoneValido = validarTelefone();

                if (!cnpjValido || !telefoneValido) {
                    mostrarAviso(
                        "Confira os campos destacados em vermelho " +
                        "antes de enviar sua solicitação.",
                        "erro"
                    );

                    if (!cnpjValido) {
                        campoCNPJ.focus();
                    } else {
                        campoTelefone.focus();
                    }

                    return;
                }

                const dados = {
                    empresaNome:
                        document.getElementById(
                            "empresaNome"
                        ).value.trim(),

                    // ENVIA CNPJ SEM PONTUAÇÃO
                    cnpj:
                        somenteNumeros(
                            campoCNPJ.value
                        ),

                    areaAtuacao:
                        document.getElementById(
                            "areaAtuacao"
                        ).value,

                    responsavel:
                        document.getElementById(
                            "responsavel"
                        ).value.trim(),

                    // ENVIA TELEFONE FORMATADO
                    telefoneComercial:
                        campoTelefone.value.trim(),

                    emailComercial:
                        document.getElementById(
                            "emailComercial"
                        ).value.trim(),

                    tipoParceria:
                        document.getElementById(
                            "tipoParceria"
                        ).value,

                    mensagem:
                        document.getElementById(
                            "mensagem"
                        ).value.trim()
                };

                btnEnviarPatrocinio.disabled = true;
                btnEnviarPatrocinio.textContent =
                    "Enviando...";

                try {
                    const response = await fetch(
                        `${API_PARCEIROS}/solicitacao`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${token}`
                            },
                            body: JSON.stringify(dados)
                        }
                    );

                    const resultado =
                        await response.json();

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        sessionStorage.removeItem(
                            "rota_token"
                        );

                        redirecionarParaLogin();
                        return;
                    }

                    if (
                        response.status === 409 ||
                        resultado.exists
                    ) {
                        mostrarAviso(
                            resultado.message ||
                            mensagemDuplicada,
                            "informacao"
                        );

                        bloquearFormulario();
                        return;
                    }

                    if (
                        response.ok &&
                        resultado.success
                    ) {
                        mostrarAviso(
                            resultado.message ||
                            mensagemSucesso,
                            "sucesso"
                        );

                        partnerForm.reset();
                        bloquearFormulario();
                        return;
                    }

                    mostrarAviso(
                        resultado.message ||
                        "Erro ao cadastrar patrocinador. Tente novamente.",
                        "erro"
                    );

                } catch (erro) {
                    console.error(
                        "Erro ao enviar solicitação:",
                        erro
                    );

                    mostrarAviso(
                        "Erro de conexão com o servidor. " +
                        "Não foi possível confirmar o cadastro.",
                        "erro"
                    );

                } finally {
                    btnEnviarPatrocinio.disabled = false;

                    btnEnviarPatrocinio.innerHTML =
                        '<i class="fas fa-paper-plane"></i> ' +
                        "Enviar Solicitação";
                }
            }
        );

        document.addEventListener(
            "DOMContentLoaded",
            verificarSolicitacao
        );

        window.addEventListener(
            "pageshow",
            function (event) {
                if (event.persisted) {
                    verificarSolicitacao();
                }
            }
        );

    </script>

    <!-- MENU DE PERFIL -->
    <script>
        function toggleProfileMenu() {
            const dropdown =
                document.getElementById(
                    "profileDropdown"
                );

            if (dropdown) {
                dropdown.classList.toggle("show");
            }
        }

        document.addEventListener(
            "click",
            function (e) {
                const menu =
                    document.querySelector(
                        ".user-profile-menu"
                    );

                const dropdown =
                    document.getElementById(
                        "profileDropdown"
                    );

                if (
                    menu &&
                    dropdown &&
                    !menu.contains(e.target)
                ) {
                    dropdown.classList.remove("show");
                }
            }
        );
    </script>

    <script src="js/cabecalho-auth.js"></script>

</body>
</html>
